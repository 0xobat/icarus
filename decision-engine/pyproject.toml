[project]
name = "decision-engine"
version = "0.1.0"
description = "Icarus v2 Execution cluster — runtime cycle, allocator, pre-trade risk gate, rules-based regime classifier"
requires-python = ">=3.13"
dependencies = [
    "icarus",
    "httpx>=0.27",
    "numpy>=2.1",
    "scipy>=1.14",
    "redis>=5.2",
    "structlog>=24.4",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "fakeredis>=2.26",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/decision_engine"]

[tool.uv.sources]
icarus = { workspace = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
