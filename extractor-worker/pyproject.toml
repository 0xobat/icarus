[project]
name = "extractor-worker"
version = "0.1.0"
description = "Icarus v2 Research cluster — paper/blog → template (manifest + evaluate.py + smoke_test + parameter_rationale)"
requires-python = ">=3.13"
dependencies = [
    "icarus",
    "anthropic>=0.39",
    "pypdf>=5.1",
    "httpx>=0.27",
    "redis>=5.2",
    "readability-lxml>=0.8.1",
    "lxml>=5.3",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "watchfiles>=0.24",  # dev hot-reload CMD (docker dev target)
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/extractor_worker"]

[tool.uv.sources]
icarus = { workspace = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "live: tests that call a real external service (frontier API via ANTHROPIC_API_KEY, or network via LIVE_NETWORK); each test is responsible for its own skip-if-missing guard",
]
