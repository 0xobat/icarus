[project]
name = "extractor-worker"
version = "0.1.0"
description = "Icarus v2 Research cluster — paper/blog → template (manifest + evaluate.py + smoke_test + parameter_rationale)"
requires-python = ">=3.13"
dependencies = [
    "icarus",
    "anthropic>=0.39",
    "openai>=1.55",
    "pypdf>=5.1",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/extractor_worker"]

[tool.uv.sources]
icarus = { workspace = true }
