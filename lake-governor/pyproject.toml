[project]
name = "lake-governor"
version = "0.1.0"
description = "Icarus v2 Curation cluster — paper-trade harness, candidate state machine, decay detector, per-template breaker"
requires-python = ">=3.13"
dependencies = [
    "icarus",
    "numpy>=2.1",
    "scipy>=1.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lake_governor"]

[tool.uv.sources]
icarus = { workspace = true }
