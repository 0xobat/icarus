[project]
name = "lake-governor"
version = "0.1.0"
description = "Icarus v2 Curation cluster — paper-trade harness, candidate state machine, decay detector, per-template breaker"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
    "icarus",
    "numpy>=2.1",
    "scipy>=1.14",
    "structlog>=24.4",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "watchfiles>=0.24",  # dev hot-reload CMD (docker dev target)
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lake_governor"]

[tool.uv.sources]
icarus = { workspace = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
