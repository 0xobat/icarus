[project]
name = "backtest-worker"
version = "0.1.0"
description = "Icarus v2 Research cluster — grid search + walk-forward validation via vectorbt"
requires-python = ">=3.13"
dependencies = [
    "icarus",
    "numpy>=2.1",
    "pandas>=2.2",
    "vectorbt>=0.27",
    "scipy>=1.14",
    "httpx>=0.27",
    "structlog>=24.4",
    "redis>=5.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/backtest_worker"]

[tool.uv.sources]
icarus = { workspace = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
