[project]
name = "icarus"
version = "0.1.0"
description = "Icarus v2 shared library — types, Protocols, DSL runtime, envelopes, data adapters"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.9",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "redis[hiredis]>=5.2",
    "jsonschema>=4.23",
    "structlog>=24.4",
    "pyyaml>=6.0.3",
    "numpy>=2",
    "scipy>=1.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/icarus"]
