[project]
name = "icarus-workspace"
version = "0.1.0"
description = "Icarus v2 (Daedalus) — strategy-lake DeFi trading bot, 9-service / 3-cluster monorepo"
readme = "README.md"
requires-python = ">=3.13"

[tool.uv.workspace]
members = [
    "lib",
    "decision-engine",
    "lake-governor",
    "extractor-worker",
    "backtest-worker",
]

[tool.uv.sources]
icarus = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "N",   # pep8-naming
    "RUF", # ruff-specific
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# --import-mode=importlib lets multiple `tests/` dirs across workspace members
# coexist without package-name collisions (lib/tests/, decision-engine/tests/, ...).
# Cross-test helpers go in conftest.py (fixtures) instead of cross-file imports.
addopts = "-q --strict-markers --tb=short --import-mode=importlib"
# templates/ contains smoke_test.py files designed for icarus.dsl's registry
# (they reference sys.modules["icarus.templates.<id>"], which pytest can't
# satisfy). Registry runs them itself; pytest must not collect them.
norecursedirs = ["templates", ".archive", "node_modules", ".venv*"]
markers = [
    "live: tests that call a real external service (frontier API via ANTHROPIC_API_KEY, or network via LIVE_NETWORK); each test is responsible for its own skip-if-missing guard",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "mypy>=1.13",
]
