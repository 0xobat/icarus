# Managed-portfolio strategy dials. Secrets + per-deployment values (RPC URL,
# wallet key, Safe address, chain) come from env, NOT this file.
# Multi-asset target (P2). Weights are fractions of NAV, must sum to 1.0; every
# corrective trade routes through `hub`. Starts 2-asset (USDC/WETH) — WBTC (cbBTC)
# joins at P2.3 with its token-registry entry + cbBTC/USD pricing, and the full
# Base-first split becomes USDC 0.40 / WETH 0.32 / WBTC 0.28.
[allocation]
hub = "USDC"             # stable funding asset; every rebalance leg is asset<->hub
band = 0.10              # +/- absolute-weight tolerance before rebalancing
[allocation.weights]
USDC = 0.40
WETH = 0.60

[rebalance]
slippage_bps = 50
cost_gate_margin = 4     # rebalance only if correction >= margin * est cost
gas_units = 200000
deadline_seconds = 60

[cadence]
interval_seconds = 300  # read every 5 min; act only on band breach

[risk]
# USDC depeg breaker: halt rebalancing when USDC drifts off-peg by more than
# this many basis points. Only armed when CHAINLINK_USDC_USD_ADDRESS is set
# (otherwise USDC stays pinned to $1 and the breaker never trips). Range (0,2000].
depeg_threshold_bps = 100

[limits]
# P2.5 exposure caps (NAV fractions). max_asset_pct is a safety net ABOVE the
# allocation band the planner enforces — it MUST be >= the largest (target
# weight + band) or it would block a legitimate rebalance. This interim 2-asset
# target has WETH 0.60 + band 0.10 = 0.70 upper, so 0.75 here. When the full
# Base target lands (max weight USDC 0.40 → 0.50 upper) this can drop to 0.60.
# per_venue_cap applies to overlay venues (the LP overlay, P3); core Aave lending
# of the allocation assets is governed by the bands.
max_asset_pct = 0.75
per_venue_cap = 0.25
lp_cap = 0.15            # P3 LP overlay cap
